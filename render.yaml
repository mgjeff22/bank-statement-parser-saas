services:
  - type: web
    name: ai-bank-statement-parser
    runtime: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bank-statement-db
          property: connectionString
      - key: BILLING_MODE
        value: live
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: bank-statement-db
    plan: starter
    databaseName: statement_parser
    user: postgres
