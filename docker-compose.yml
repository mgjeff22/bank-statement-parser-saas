services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/statement_parser
      - SECRET_KEY=generate-a-strong-32-character-secret-key-here
      - BILLING_MODE=mock
      - UPLOAD_DIR=storage/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/backend/storage/uploads

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=statement_parser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_uploads:
  postgres_data:
